<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>慮 記錄網 관리자</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-top">
    <div><b>慮 記錄網</b><span>RECORD CONTROL TERMINAL</span></div>
    <div class="admin-user" id="adminUser">인증 확인 중</div>
  </header>
  <main class="admin-layout">
    <aside class="admin-list-panel">
      <div class="panel-head"><h1>기록 관리</h1><button id="newBtn">＋ 새 기록</button></div>
      <div class="archive-filter-block">
        <label>기록 연도
          <select id="yearFilter" class="year-filter"></select>
        </label>
        <div id="yearArchiveMeta" class="year-archive-meta"></div>
      </div>
      <input id="filterInput" class="filter" placeholder="기록번호·제목 검색" />
      <div id="recordList" class="record-list"><p class="loading">기록망 연결 중…</p></div>
    </aside>
    <section class="editor-panel">
      <form id="recordForm">
        <input type="hidden" id="recordId" />
        <div class="editor-head">
          <div><span>RECORD EDITOR</span><h2 id="editorTitle">새 사건 기록</h2></div>
          <div class="editor-actions"><button type="button" id="deleteBtn" class="danger" hidden>삭제</button><button type="submit" class="primary">기록 저장</button></div>
        </div>
        <div id="message" class="message" hidden></div>
        <div class="form-grid">
          <label>기록번호<input id="recordNo" required placeholder="RY-2026-001" /></label>
          <label>임시 명칭<input id="title" required /></label>
          <label>지역<input id="region" value="미상" /></label>
          <fieldset class="type-fieldset">
            <legend>괴이 유형 <small>복수 선택 가능</small></legend>
            <div class="type-options" id="recordTypeOptions">
              <label><input type="checkbox" name="recordType" value="現象" /> 현상형</label>
              <label><input type="checkbox" name="recordType" value="個體" /> 개체형</label>
              <label><input type="checkbox" name="recordType" value="物件" /> 물건형</label>
              <label><input type="checkbox" name="recordType" value="傳染" /> 전염형</label>
              <label><input type="checkbox" name="recordType" value="記錄" /> 기록형</label>
              <label><input type="checkbox" name="recordType" value="未分類" checked /> 미분류</label>
            </div>
          </fieldset>
          <label>위험 분류
            <select id="riskLevel">
              <option value="평가 불가">평가 불가</option>
              <option value="접근 제한">접근 제한</option>
              <option value="기록 오염">기록 오염</option>
              <option value="인명 위험">인명 위험</option>
            </select>
          </label>
          <label>진행 상태
            <select id="status">
              <option value="관찰 중">관찰 중</option>
              <option value="분석 중" selected>분석 중</option>
              <option value="회수 대기">회수 대기</option>
              <option value="격리 유지">격리 유지</option>
              <option value="회수 완료">회수 완료</option>
              <option value="열람 금지">열람 금지</option>
              <option value="회수 기록 없음">회수 기록 없음</option>
            </select>
          </label>
          <label class="wide">담당 삼직<input id="assignedTo" placeholder="探-00 / 硏-00 / 護-00" /></label>
          <label class="wide">목록 요약<textarea id="summary" rows="3"></textarea></label>
          <label class="wide">기록 본문<textarea id="content" rows="15"></textarea></label>
          <label class="publish"><input type="checkbox" id="published" /> 일반 열람자에게 공개</label>
        </div>
      </form>
    </section>
  </main>
  <script src="../archive-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
